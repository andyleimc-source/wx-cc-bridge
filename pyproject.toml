[project]
name = "wx-cc-bridge"
version = "0.1.0"
description = "WeChat iLink x Claude Code CLI bridge"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "qrcode>=7.4",
]

[project.scripts]
wx-echo = "wx_cc_bridge.echo:run"
wx-bridge = "wx_cc_bridge.bridge:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wx_cc_bridge"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
